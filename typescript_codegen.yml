overwrite: true
schema: "src/shared/@types/schema.graphql"
documents: null
generates:
  src/shared/@types/autogenerated-gql-types.d.ts:
    plugins:
      - add:
          content:
            - ''
            - 'declare global {'
      - add:
          placement: 'append'
          content: '}'
      - typescript
      - typescript-resolvers
    config:
      namingConvention:
        enumValues: keep
