<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Authorize</title>
    <style>
      .container {
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        margin: 100px auto 0;
        max-width: 80%;
        text-align: center;
      }
      .container.handelszeitung .lds-ellipsis div {
        background: #192a6b;
      }
      .container.bilanz .lds-ellipsis div {
        background: #454444;
      }
      .container.gaultmillau .lds-ellipsis div {
        background: black;
      }
      .container.beobachter .lds-ellipsis div {
        background: #df0000;
      }
      .container.schweizer-illustrierte .lds-ellipsis div {
        background: #ca0c25;
      }
      .lds-ellipsis {
        display: block;
        height: 64px;
        margin: 0 auto;
        position: relative;
        width: 64px;
      }
      .lds-ellipsis div {
        animation-timing-function: cubic-bezier(0, 1, 1, 0);
        background: black;
        border-radius: 50%;
        height: 11px;
        position: absolute;
        top: 27px;
        width: 11px;
      }
      .lds-ellipsis div:nth-child(1) {
        animation: lds-ellipsis1 0.6s infinite;
        left: 6px;
      }
      .lds-ellipsis div:nth-child(2) {
        animation: lds-ellipsis2 0.6s infinite;
        left: 6px;
      }
      .lds-ellipsis div:nth-child(3) {
        animation: lds-ellipsis2 0.6s infinite;
        left: 26px;
      }
      .lds-ellipsis div:nth-child(4) {
        animation: lds-ellipsis3 0.6s infinite;
        left: 45px;
      }

      @keyframes lds-ellipsis1 {
        0% {
          transform: scale(0);
        }
        100% {
          transform: scale(1);
        }
      }

      @keyframes lds-ellipsis3 {
        0% {
          transform: scale(1);
        }
        100% {
          transform: scale(0);
        }
      }

      @keyframes lds-ellipsis2 {
        0% {
          transform: translate(0, 0);
        }
        100% {
          transform: translate(19px, 0);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="lds-ellipsis">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </div>
    </div>
  </body>
</html>
